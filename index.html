<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign in</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #eef1f6 0%, #dfe5ee 100%);
    color: #1d2330;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 16px;
    padding: 36px 32px 28px;
    box-shadow: 0 10px 40px rgba(29, 35, 48, 0.10), 0 2px 6px rgba(29, 35, 48, 0.06);
  }
  .logo {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #4f6bed, #7b5cf0);
    margin: 0 auto 20px;
  }
  h1 { font-size: 22px; text-align: center; margin: 0 0 6px; }
  .sub { text-align: center; color: #6b7385; font-size: 14px; margin: 0 0 28px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  .field { margin-bottom: 16px; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid #d4d9e2;
    border-radius: 10px;
    background: #fafbfc;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input:focus {
    outline: none;
    border-color: #4f6bed;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(79, 107, 237, 0.15);
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    margin: 4px 0 22px;
  }
  .row label { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0; color: #4a5263; }
  .row a { color: #4f6bed; text-decoration: none; }
  button {
    width: 100%;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(135deg, #4f6bed, #6a5cf0);
    cursor: pointer;
    transition: transform .05s, box-shadow .15s;
  }
  button:hover { box-shadow: 0 6px 18px rgba(79, 107, 237, 0.35); }
  button:active { transform: translateY(1px); }
  .msg {
    display: none;
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    color: #b4413a;
  }
  .poc {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #eef0f4;
    text-align: center;
    font-size: 11px;
    color: #9aa1ad;
  }
</style>
</head>
<body>

<main class="card">
  <div class="logo" aria-hidden="true"></div>
  <h1>Sign in</h1>
  <p class="sub">Welcome back. Please enter your details.</p>

  <!-- Demo only: no action, no field names, submit is blocked. -->
  <form id="f" autocomplete="off" novalidate>
    <div class="field">
      <label for="u">Email</label>
      <input id="u" type="text" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="p">Password</label>
      <input id="p" type="password" placeholder="••••••••">
    </div>
    <div class="row">
      <label><input type="checkbox"> Remember me</label>
      <a href="#" onclick="return false">Forgot password?</a>
    </div>
    <button type="submit">Sign in</button>
    <p class="msg" id="m">Demo form — nothing was sent.</p>
  </form>

  <div class="poc">Security PoC — demo only, no data is collected</div>
</main>

<script>
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('u').value = '';
    document.getElementById('p').value = '';
    document.getElementById('m').style.display = 'block';
  });
</script>
</body>
</html>
